<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Pumpkin Carver – carve a glowing 3D jack-o’-lantern</title>
<meta name="description" content="Carve a real-feeling 3D pumpkin with your mouse or finger: chunks pop out, the candle lights your glowing face. Match target faces against the clock or carve freely. Easy/Medium/Hard, kids mode, EN/DE.">
<meta name="theme-color" content="#0a0818">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8E%83%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-state="menu">
<canvas id="game" aria-label="Pumpkin Carver game"></canvas>
<div id="pops"></div>
<div id="hud">
  <div class="chip" id="hScoreBox"><small data-t="score">Score</small><b id="hScore">0</b></div>
  <div class="chip"><small data-t="pumpkin">Pumpkin</small><b id="hPumpkin">1/3</b></div>
  <div class="chip" id="hTimeBox"><small data-t="time">Time</small><b id="hTime">60</b></div>
  <div class="chip" id="hAccBox"><small data-t="acc">Match</small><b id="hAcc">0%</b></div>
</div>
<div id="hint"></div>
<div id="carveUI"><button id="btnUndo" class="pill2" data-t="undo">Undo</button><button id="btnLight" class="pill2 main" data-t="light">Light it!</button></div>
<div id="top">
  <button id="btnQ" class="pill">⚙</button>
  <button id="btnSound" class="pill on" aria-label="Sound">🔊</button>
  <button id="btnLang" class="pill">DE</button>
</div>
<div id="toast"></div>
<section id="menu" class="panel show">
  <h1 data-t="title">Pumpkin Carver</h1>
  <p class="sub" data-t="sub"></p>
  <ul class="how">
    <li><span>🔪</span><em data-t="h1"></em></li>
    <li><span>⏱️</span><em data-t="h2"></em></li>
    <li><span>🕯️</span><em id="h3"></em></li>
  </ul>
  <button id="btnPlay" class="big" data-t="play">Carve!</button>
  <div id="diff" role="group"><small data-t="difficulty"></small><button data-d="easy" data-t="d_easy"></button><button data-d="medium" data-t="d_medium"></button><button data-d="hard" data-t="d_hard"></button></div>
  <div class="row"><button id="btnFree" data-t="free">Free carving</button><button id="btnKids" class="toggle" aria-pressed="false"><i></i><span data-t="kids">Kids mode</span></button></div>
</section>
<section id="end" class="panel">
  <h2 id="eTitle"></h2>
  <div id="eScore" class="score">0</div>
  <div id="eBest" class="best"></div>
  <div id="eStats" class="stats"></div>
  <label class="name"><span data-t="name">Your name</span><input id="eName" maxlength="18" value="Player" autocomplete="off"></label>
  <div class="row"><button id="btnCard" data-t="card"></button><button id="btnShare" data-t="share"></button></div>
  <div class="row"><button id="btnAgain" class="big" data-t="again"></button><button id="btnMenu" data-t="menu"></button></div>
</section>
<script src="js/sounds-src.js"></script>
<script src="js/game.bundle.js"></script>
</body>
</html>
